name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop
          - feature-login

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint
      run: npm run lint --if-present
    
    - name: Test
      run: npm test --if-present
    
    - name: Build
      run: npm run build --if-present

  build-push:
    name: Build & Push Images
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    
    strategy:
      matrix:
        service:
          - { name: gateway, dockerfile: gateway/Dockerfile }
          - { name: auth, dockerfile: services/auth/Dockerfile }
          - { name: computer, dockerfile: services/computer/Dockerfile }
          - { name: travel, dockerfile: services/travel/Dockerfile }
          - { name: solutions, dockerfile: services/solutions/Dockerfile }
          - { name: enquiry, dockerfile: services/enquiry/Dockerfile }
          - { name: notification, dockerfile: services/notification/Dockerfile }
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ matrix.service.dockerfile }}
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/zetnet-${{ matrix.service.name }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/zetnet-${{ matrix.service.name }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: Deploy to K8s
    needs: build-push
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
    
    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
    
    - name: Verify cluster connection
      run: kubectl cluster-info
    
    - name: Create namespace
      run: kubectl create namespace zetnet --dry-run=client -o yaml | kubectl apply -f -
    
    - name: Update ConfigMap
      run: kubectl apply -f infra/kubernetes/configmap.yaml
    
    - name: Update Secrets
      run: |
        kubectl delete secret zetnet-secrets -n zetnet --ignore-not-found
        kubectl create secret generic zetnet-secrets -n zetnet \
          --from-literal=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
          --from-literal=SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
          --from-literal=JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}" \
          --from-literal=TWILIO_ACCOUNT_SID="${{ secrets.TWILIO_ACCOUNT_SID }}" \
          --from-literal=TWILIO_AUTH_TOKEN="${{ secrets.TWILIO_AUTH_TOKEN }}" \
          --from-literal=TWILIO_WHATSAPP_FROM="${{ secrets.TWILIO_WHATSAPP_FROM }}" \
          --from-literal=ADMIN_WHATSAPP_NUMBER="${{ secrets.ADMIN_WHATSAPP_NUMBER }}"
    
    - name: Update image tags
      run: |
        sed -i "s|YOUR_REGISTRY|${{ secrets.DOCKER_USERNAME }}|g" infra/kubernetes/*.yaml
        sed -i "s|:latest|:${{ github.sha }}|g" infra/kubernetes/*.yaml
    
    - name: Deploy services
      run: |
        kubectl apply -f infra/kubernetes/auth.yaml
        kubectl apply -f infra/kubernetes/computer.yaml
        kubectl apply -f infra/kubernetes/services.yaml
        kubectl apply -f infra/kubernetes/gateway.yaml
    
    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/auth -n zetnet --timeout=5m
        kubectl rollout status deployment/computer -n zetnet --timeout=5m
        kubectl rollout status deployment/travel -n zetnet --timeout=5m
        kubectl rollout status deployment/solutions -n zetnet --timeout=5m
        kubectl rollout status deployment/enquiry -n zetnet --timeout=5m
        kubectl rollout status deployment/notification -n zetnet --timeout=5m
        kubectl rollout status deployment/gateway -n zetnet --timeout=5m
    
    - name: Get deployment status
      run: |
        echo "=== Pods ==="
        kubectl get pods -n zetnet
        echo ""
        echo "=== Services ==="
        kubectl get services -n zetnet
    
    - name: Deployment summary
      run: |
        echo "✅ Deployment completed successfully!"
        echo "📦 Image tag: ${{ github.sha }}"
        echo "🔗 Gateway URL:"
        kubectl get service gateway-service -n zetnet -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
