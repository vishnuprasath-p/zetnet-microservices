apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: zetnet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: YOUR_REGISTRY/zetnet-auth:latest
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        envFrom:
        - configMapRef:
            name: zetnet-config
        - secretRef:
            name: zetnet-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: zetnet
spec:
  selector:
    app: auth
  ports:
  - port: 3001
    targetPort: 3001
