apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel
  namespace: zetnet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel
  template:
    metadata:
      labels:
        app: travel
    spec:
      containers:
      - name: travel
        image: YOUR_REGISTRY/zetnet-travel:latest
        ports:
        - containerPort: 3003
        env:
        - name: PORT
          value: "3003"
        envFrom:
        - configMapRef:
            name: zetnet-config
        - secretRef:
            name: zetnet-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: travel-service
  namespace: zetnet
spec:
  selector:
    app: travel
  ports:
  - port: 3003
    targetPort: 3003
---
