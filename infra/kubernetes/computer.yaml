apiVersion: apps/v1
kind: Deployment
metadata:
  name: computer
  namespace: zetnet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: computer
  template:
    metadata:
      labels:
        app: computer
    spec:
      containers:
      - name: computer
        image: YOUR_REGISTRY/zetnet-computer:latest
        ports:
        - containerPort: 3002
        env:
        - name: PORT
          value: "3002"
        envFrom:
        - configMapRef:
            name: zetnet-config
        - secretRef:
            name: zetnet-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: computer-service
  namespace: zetnet
spec:
  selector:
    app: computer
  ports:
  - port: 3002
    targetPort: 3002
